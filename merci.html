<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci - Brasserie La Skola</title>
    <!-- Google Fonts pour un style élégant (DA de La Skola) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #d4af37; /* Or / Gold */
            --bg-color: #1a1a1a; /* Noir charbon profond */
            --text-color: #f5f5f5; /* Blanc cassé pour la lisibilité */
            --font-title: 'Playfair Display', serif;
            --font-text: 'Lato', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-text);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }

        .thank-you-container {
            max-width: 600px;
            padding: 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Ornement subtil en haut et en bas */
        .thank-you-container::before,
        .thank-you-container::after {
            content: '♦';
            color: var(--primary-color);
            font-size: 24px;
            display: block;
            margin: 10px 0;
        }

        h1 {
            font-family: var(--font-title);
            color: var(--primary-color);
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn-home {
            display: inline-block;
            padding: 12px 30px;
            font-family: var(--font-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
            color: var(--bg-color);
            background-color: var(--primary-color);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-home:hover {
            background-color: #b5952f;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        .logo-placeholder {
            font-family: var(--font-title);
            font-size: 2rem;
            color: var(--primary-color);
            margin-bottom: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="thank-you-container">
        <div class="logo-placeholder">LS</div>
        <h1>Merci !</h1>
        <p>Votre message a bien été envoyé à la Brasserie La Skola.<br>Notre équipe vous recontactera dans les plus brefs délais pour donner suite à votre demande.</p>
        <a href="index.html" class="btn-home">Retour à l'accueil</a>
    </div>

</body>
</html>
